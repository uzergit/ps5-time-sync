name: build-elf

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to publish (e.g. v1.0). Leave empty to only build."
        required: false
        default: ""
      prerelease:
        description: "Publish as a pre-release (test builds; never shown as latest)"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

env:
  PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
  # Commit of github.com/ps5-payload-dev/sdk used if the release zip
  # cannot be downloaded (releases are published as pre-releases, which
  # GitHub's "latest/download" URL may not resolve).
  SDK_FALLBACK_REF: f7fd02e6e195902a449b5e664917be8c01888b34

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash wget unzip make clang-18 lld-18 llvm-18

      - name: Install ps5-payload-sdk
        run: |
          if wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip; then
            # The zip contains a top-level ps5-payload-sdk/ directory.
            sudo unzip -q -d /opt ps5-payload-sdk.zip
          else
            echo "Release zip unavailable, building SDK from source"
            git clone https://github.com/ps5-payload-dev/sdk.git /tmp/sdk-src
            git -C /tmp/sdk-src checkout "$SDK_FALLBACK_REF"
            sudo make -C /tmp/sdk-src DESTDIR="$PS5_PAYLOAD_SDK" install
          fi
          test -f "$PS5_PAYLOAD_SDK/toolchain/prospero.mk"

      - name: Build
        env:
          # Built into the payload for the update check; "dev" disables it.
          VERSION: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'dev' }}
          UPDATE_REPO: ${{ github.repository }}
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: time-sync
          path: |
            time-sync.elf
            time-unsync.elf
            config.ini

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: time-sync

      # Payload Manager repository listing this release's payloads.
      - name: Write payloads.json
        run: python3 tools/payloads_json.py "${{ inputs.release || github.ref_name }}" "${{ github.repository }}" payloads.json

      # Publishes an existing (e.g. half-finished draft) release for the tag,
      # or creates it on the commit just built.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release || github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease && 'true' || 'false' }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            kind="--prerelease"
          else
            kind="--latest"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" time-sync.elf time-unsync.elf config.ini payloads.json --clobber
            gh release edit "$TAG" --draft=false $kind
          else
            gh release create "$TAG" time-sync.elf time-unsync.elf config.ini payloads.json \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes $kind
          fi
