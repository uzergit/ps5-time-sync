; time-sync payload settings
[timesyncer]

; NTP servers to try in order, separated by commas.
; Hostnames or IPv4 addresses. Use an IP if DNS is blocked,
; e.g. 162.159.200.1 (Cloudflare).
servers = time.apple.com, time.cloudflare.com, pool.ntp.org

; UDP port of the NTP server.
port = 123

; Seconds to wait for each server before trying the next.
timeout = 2

; Measurements per server (1-8). The one with the shortest network
; delay is used, which gives the most accurate time.
samples = 4

; time-sync keeps retrying for this many seconds if no server
; answers, e.g. while the network is still coming up at boot.
retry_for = 30

; On-screen notifications: all, errors, off
notify = all

; After syncing, check GitHub (at most once a day) for a newer
; release and show a notification if there is one: on, off
update_check = on

; If time-unsync moved the clock, wait up to this many seconds
; for etaHEN to finish starting before syncing (0 = don't wait).
etahen_wait = 60

[unsync]
; auto:  find the etaHEN payload in the usual autoloader folders,
;        read its expiry date and set the clock 2 days before it.
;        Full (non-beta) releases leave the clock alone. If no
;        etaHEN payload is found, unsync_date is used instead.
; fixed: always use unsync_date.
unsync_mode = auto

; Extra places to look for etaHEN first, separated by commas
; (files or folders), e.g. /mnt/usb0/payloads/etaHEN.elf
etahen_path =

; Date to use in fixed mode, or when auto finds nothing. UTC:
; YYYY-MM-DD or YYYY-MM-DD HH:MM:SS. Pick a date when your
; time-limited payload (e.g. an etaHEN beta) was still valid.
unsync_date = 2025-01-01 00:00:00
